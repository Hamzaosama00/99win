<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="lgBg" cx="32%" cy="20%" r="100%">
      <stop offset="0" stop-color="#33101f"/>
      <stop offset="0.55" stop-color="#170a12"/>
      <stop offset="1" stop-color="#0a070b"/>
    </radialGradient>
    <linearGradient id="lgGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.42" stop-color="#f7c948"/>
      <stop offset="0.74" stop-color="#e0a106"/>
      <stop offset="1" stop-color="#a06f04"/>
    </linearGradient>
    <linearGradient id="lgRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.5" stop-color="#e8114b"/>
      <stop offset="1" stop-color="#57051f"/>
    </linearGradient>
    <linearGradient id="lgTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8114b" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#e8114b"/>
      <stop offset="1" stop-color="#ff5c6e"/>
    </linearGradient>
    <!-- Chunky "9" glyph built from strokes (font-independent) -->
    <g id="lgNine">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#lgGold)" stroke-width="10"/>
      <path d="M 15 0 C 15 15 9 23 -4 26" fill="none" stroke="url(#lgGold)" stroke-width="10" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- badge -->
  <rect x="3" y="3" width="90" height="90" rx="24" fill="url(#lgBg)" stroke="url(#lgRim)" stroke-width="3"/>
  <rect x="7.5" y="7.5" width="81" height="81" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- 99 wordmark (italic lean) -->
  <g transform="translate(30,39) skewX(-8)">
    <use href="#lgNine" xlink:href="#lgNine"/>
  </g>
  <g transform="translate(66,39) skewX(-8)">
    <use href="#lgNine" xlink:href="#lgNine"/>
  </g>

  <!-- flight-trail swoosh + mini plane -->
  <path d="M 18 74 Q 47 84 76 66" fill="none" stroke="url(#lgTrail)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 74 71 L 88 61.5 L 82.5 74.5 Q 78 75.5 74 71 Z" fill="url(#lgTrail)"/>

  <!-- spark -->
  <path d="M 77 17 L 79.2 22.8 L 85 25 L 79.2 27.2 L 77 33 L 74.8 27.2 L 69 25 L 74.8 22.8 Z" fill="#f7c948" opacity="0.9"/>
</svg>
